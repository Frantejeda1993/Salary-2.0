name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  engine:
    name: Motor TypeScript
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: engine/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  app:
    name: App (tipos, tests y build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Dependencias de producción sin vulnerabilidades altas
        run: npm audit --omit=dev --audit-level=high
      - run: npm test
      - run: npm run build

  e2e:
    name: App (recorridos en el navegador)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
        env:
          CI: "1"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: app/playwright-report
          retention-days: 7

  rules:
    name: Reglas de Firestore (emulador)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rules-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci --no-audit --no-fund
      - run: npm test

  migrate:
    name: Migración y referencias (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/migrate
    steps:
      - uses: actions/checkout@v4
      # Motor de la app vieja, solo para leerlo. Si el repo no es accesible, los tests
      # que lo necesitan se omiten (no fallan).
      - uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: Frantejeda1993/Salary
          ref: b93f3527229caf8a5fab241ea3c90b71b3f0c274
          path: salary-legacy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
        env:
          SALARY_LEGACY_PATH: ${{ github.workspace }}/salary-legacy

  secrets:
    name: Secretos (todo el historial)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git . --redact --no-banner -c .gitleaks.toml

