name: App Android

# Compila, prueba y firma el APK; lo publica en Releases como salary.apk (enlace fijo:
# https://github.com/Frantejeda1993/Salary-2.0/releases/latest/download/salary.apk).
# La firma sale de los secrets del repo (ver docs/ANDROID.md); sin ellos solo compila y prueba.
on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    env:
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Tests del lector de pagos
        run: |
          gradle --no-daemon testDebugUnitTest > ../gradle-test.log 2>&1 || { tail -n 60 ../gradle-test.log | sed 's/^/::error title=Tests::/' ; exit 1; }

      - name: Clave de firma
        id: key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning title=Sin firma::Faltan los secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS y ANDROID_KEY_PASSWORD (ver docs/ANDROID.md). Solo se compila, no se publica."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          else
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/salary.jks"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Compilar APK firmado
        if: steps.key.outputs.signed == 'true'
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/salary.jks
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle --no-daemon assembleRelease > ../gradle-build.log 2>&1 || { grep -E "error|FAILURE|What went wrong|e: |\.java:[0-9]+" ../gradle-build.log | head -n 40 | sed 's/^/::error title=Compilación::/' ; tail -n 30 ../gradle-build.log | sed 's/^/::error title=Final del registro::/' ; exit 1; }

      - name: Compilar sin firmar (comprobación)
        if: steps.key.outputs.signed != 'true'
        run: |
          gradle --no-daemon assembleDebug > ../gradle-build.log 2>&1 || { grep -E "error|FAILURE|What went wrong|e: |\.java:[0-9]+" ../gradle-build.log | head -n 40 | sed 's/^/::error title=Compilación::/' ; tail -n 30 ../gradle-build.log | sed 's/^/::error title=Final del registro::/' ; exit 1; }

      - name: Publicar en Releases
        if: steps.key.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CHANGES: ${{ github.event.head_commit.message || 'compilación manual' }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk salary.apk
          gh release create "android-v${VERSION_CODE}" salary.apk \
            --title "Salary para Android 0.1.${VERSION_CODE}" \
            --notes "Instálalo desde el móvil: descarga salary.apk y ábrelo. Cambios: ${CHANGES}" \
            --latest
          echo "::notice title=APK publicado::https://github.com/${{ github.repository }}/releases/latest/download/salary.apk"
